# CONFIGURATION OF THE PIPELINE
# Units: m = metres, s = seconds, llr = log-odds.

team_name: DataScienceClass21                   # OUTPUT FILE NAME

paths:
  data_dir: null                                # MATCH DATA FOLDER (if it is null, env var MTAH_DATA_DIR)
  official_repo: ../more-than-a-hack-2027       # OFFICIAL CHALLENGE REPOSITORY (with games.py and the validator)
  cache_dir: cache                              # PARSED TRACKING AND SHIRT COLOUR SAMPLES
  output_dir: outputs                           # WHERE THE SUBMISSION CSV IS WRITTEN

ball_gaps:
  interpolate_max_frames: 12                    # BALL GAPS UP TO THIS FRAMES ARE FILLED LINEARLY

broadcast:                                      # BROADCAST TRACKING
  enabled: true                                 # ENABLE THE DATA
  fill_ball: true                               # FILL THE GAPS WHERE THE TACTICAL TRACKING HAS NONE BALL
  window_s: 60                                  # ALIGNMENT WITH TACTICAL TRACKING
  windows_per_half: 12
  min_ball_frames: 300
  max_lead_s: 200                               # BROADCAST STARTS 200'' BEFORE TACTICAL
  match_m: 2.0                                  # MAX DISTANCE BETWEEN BOTH BALLS IN A MATCHING WINDOW
  offset_tolerance_frames: 3                    # WINDOWS WITH THE SAME OFFSET (+-3 FRAMES)
  min_windows: 4                                # MIN WINDOWS THAT MUST AGREE
  min_players: 4                                # LIVE FRAME: MIN PLAYERS IN EACH CAMERA
  live_m: 2.0                                   # LIVE FRAME: MAX DISTANCE BETWEEN THE PLAYERS OF BOTH CAMERAS

context:
  second_half_kickoff_frame: 113742             # 2ND HALF KICK-OFF (published by the organisers); BEFORE IT ALWAYS D

  keepers:                                      # GOALKEEPER IDENTITY SWAPS
    enabled: true                               # ENABLE THE CORRECTION
    depth_m: 17.0                               # GOALKEEPER: MOST OF A HALF CLOSER THAN THIS TO A GOAL LINE
    share: 0.7                                  # SHARE OF FRAMES NEAR THE GOAL LINE

  jersey:                                       # TEAM OF EACH TRACK FROM THE SHIRT COLOUR IN THE VIDEO
    enabled: true                               # ENABLE THE CORRECTION
    step: 5                                     # LOOK AT 1 FRAME OF EVERY 5
    torso_from_m: 0.9                           # TORSO BOX: HEIGHT FROM
    torso_to_m: 1.5                             # TORSO BOX: HEIGHT TO
    torso_half_width_m: 0.3                     # TORSO BOX: HALF WIDTH
    l2: 0.001                                   # REGULARISATION OF THE COLOUR MODEL
    clip: 3.0                                   # MAX EVIDENCE OF ONE SAMPLE
    overlap_weight: 0.75                        # WEIGHT OF A SAMPLE WITH ANOTHER PLAYER OVER THE BOX
    kit_quantile: 0.995                         # RARER COLOURS ARE NO EVIDENCE (referee, goalkeeper)
    prior_cost: 6.0                             # COST OF A NEW TRACK STARTING IN THE OTHER TEAM
    switch_cost: 9.0                            # COST OF LEAVING THE METADATA TEAM
    return_cost: 3.0                            # COST OF COMING BACK TO IT
    gap_s: 1.0                                  # LONGER GAPS START A NEW TRACK

  pseudo:                                       # AUTOMATIC LABELS OF THE DEAD BALL MODEL
    out_m: 1.0                                  # DEAD: BALL OUTSIDE THE PITCH
    set_piece_s: 3                              # DEAD: FIRST SECONDS OF A SET PIECES TAG
    live_edge_m: 3.0                            # LIVE: BALL INSIDE THE PITCH
    live_near_m: 1.5                            # LIVE: PLAYER NEAR THE BALL
    live_ball_speed: 1.0                        # LIVE: BALL MOVING

  dead_weight: 0.3                              # WEIGHT OF THE DEAD BALL MODEL (player speeds)
  dead_llr_clip: 3.0                            # MAX EVIDENCE PER FRAME

  ball_dead:                                    # DEAD BALL RULES
    out_m: 1.0                                  # BALL OUTSIDE THE PITCH
    out_llr: 2.0                                # EVIDENCE OF DEAD
    inside_m: 1.0                               # BALL INSIDE THE PITCH
    inside_llr: 0.5                             # EVIDENCE OF LIVE
    gap_after_out_llr: 1.0                      # BALL LOST AFTER GOING OUT: DEAD UNTIL SEEN AGAIN
    exit_pred_s: 1.0                            # BALL LOST GOING TO A LINE: DEAD
    isolated_m: 6.0                             # ABANDONED BALL: NOBODY CLOSER THAN THIS
    isolated_max_speed: 8.0                     # ABANDONED BALL: SLOWER THAN THIS
    isolated_s: 2.0                             # ABANDONED BALL: FOR THIS TIME
    isolated_llr: 1.5                           # EVIDENCE OF DEAD
    kick_speed: 6.0                             # KICK: BALL FASTER THAN THIS, PLAY RESTARTS
    kick_llr: 2.0                               # EVIDENCE OF LIVE
    kick_from_line: true                        # KICK FROM A LINE ALSO COUNTS (corner, throw-in)
    latch_llr: 1.5                              # AFTER GOING OUT, DEAD UNTIL THE NEXT KICK
    latch_max_s: 60                             # MAX TIME OF THE LATCH

  restart_check:                                # ONE PLAYER MOVING A DEAD BALL IS NOT A RESTART
    enabled: true                               # ENABLE THE RULE
    rest_speed: 1.0                             # BALL AT REST AGAIN: SLOWER THAN THIS
    rest_s: 1.0                                 # BALL AT REST AGAIN: FOR THIS TIME
    max_s: 6                                    # WITHIN THIS TIME AFTER THE KICK

  gap_restart:                                  # BALL GAP THAT IS A STOPPAGE (free kick, offside)
    enabled: true                               # ENABLE THE RULE
    min_s: 3                                    # MIN GAP DURATION
    max_move_m: 10.0                            # BALL REAPPEARS CLOSER THAN THIS TO WHERE IT WAS LOST
    llr: 1.5                                    # EVIDENCE OF DEAD

  goal:                                         # GOAL: DEAD UNTIL THE KICK-OFF
    zone_depth_m: 16.5                          # ZONE IN FRONT OF EACH GOAL: DEPTH
    zone_half_width_m: 20.16                    # ZONE IN FRONT OF EACH GOAL: HALF WIDTH
    goal_lookback_s: 300                        # MAX TIME BEFORE THE KICK-OFF TAG

  ball:                                         # NEAREST TEAM TO THE BALL (replaced by the control model)
    scale_m: 1.0
    weight: 1.0
    contact_m: 2.0

  tag_weight: 0.03                              # WEIGHT OF THE SMART TAGGING ATTACK PHASES (only without ball)

  shape:                                        # TEAM SHAPE MODEL (only without ball)
    weight: 0.1                                 # WEIGHT PER FRAME
    clip: 3.0                                   # MAX EVIDENCE PER FRAME
    smooth_s: 2                                 # MOVING AVERAGE
    own_m: 1.0                                  # AUTOMATIC LABELS: TEAM CLOSER THAN THIS TO THE BALL
    opp_m: 2.0                                  # AUTOMATIC LABELS: RIVAL FURTHER THAN THIS

  control:                                      # LEARNT MODEL OF WHO CONTROLS THE BALL (trained on 10 other games)
    enabled: true                               # ENABLE THE MODEL
    model: models/control_mlp.json              # NEURAL NETWORK
    ensemble: [models/control_lin.json]         # LINEAR MODEL (averaged with the network)
    features: [base, motion]                    # FEATURES OF THE MODELS
    replace_proximity: true                     # REPLACES THE NEAREST TEAM EVIDENCE
    weight: 1.0                                 # WEIGHT WITH THE BALL SEEN
    gap_weight: 0.1                             # WEIGHT WITHOUT BALL
    second_view_weight: 0.3                     # WEIGHT OF THE BROADCAST CAMERA OPINION
    clip: 4.0                                   # MAX EVIDENCE PER FRAME

  passes:                                       # TOUCHES, KICKS AND PASSES
    touch_m: 1.5                                # TOUCH: PLAYER CLOSER THAN THIS TO THE BALL
    contest_m: 2.0                              # TOUCH: NO RIVAL CLOSER THAN THIS
    min_touch_frames: 2                         # MIN FRAMES OF THE PASSER
    min_receive_frames: 4                       # MIN FRAMES OF THE RECEIVER
    min_pass_m: 5.0                             # MIN PASS DISTANCE
    max_gap_s: 4                                # MAX PASS DURATION
    pass_llr: 15                                # EVIDENCE PER PASS
    kicker_m: 2.0                               # KICKER: PLAYER CLOSER THAN THIS BEFORE A KICK
    kick_team_llr: 10                           # EVIDENCE FOR THE KICKER TEAM

  restart:                                      # SET PIECES TAG WITH A TEAM: THAT TEAM RESTARTS
    delay_s: 3                                  # WINDOW START AFTER THE TAG
    length_s: 10                                # WINDOW LENGTH
    weight: 0.3                                 # EVIDENCE PER FRAME

  dead_support:                                 # A STOPPAGE NEEDS A REASON, IF NOT IT IS LIVE
    enabled: true                               # ENABLE THE RULE
    out_before_s: 2                             # REASON: BALL OUT DURING OR BEFORE
    line_m: 2.0                                 # REASON: BALL LOST OR RESTART NEAR A LINE
    centre_m: 3.0                               # REASON: RESTART ON THE CENTRE SPOT
    restart_window_s: 3                         # TIME TO LOOK FOR THE RESTART
    sp_before_s: 5                              # REASON: SET PIECES TAG BEFORE
    sp_after_s: 5                               # REASON: SET PIECES TAG AFTER
    long_s: 30                                  # REASON: LONG STOPPAGE (goals, injuries, substitutions)

  tv_cut:                                       # TV OUT OF THE LIVE SHOT (replays, close-ups)
    enabled: true                               # ENABLE THE RULE (needs broadcast)
    support_share: 0.5                          # REASON: SHARE OF THE STOPPAGE WITH TV OUT OF THE LIVE SHOT

  dead_trim:                                    # TRIM THE EDGES OF EACH STOPPAGE
    enabled: true                               # ENABLE THE CORRECTION
    start_s: 0.3                                # STOPPAGE STARTS LATER
    end_s: 0.15                                 # PLAY RESTARTS EARLIER
    min_s: 1.0                                  # MIN STOPPAGE DURATION AFTER THE TRIM

  transition_cost:                              # VITERBI COSTS OF CHANGING STATE
    team_switch: 16                             # H <-> A
    to_dead: 10                                 # LIVE -> D
    from_dead: 5                                # D -> LIVE
    min_dead_s: 3.0                             # MIN STOPPAGE DURATION
    restart_without_kick: 10                    # EXTRA COST OF A RESTART WITHOUT KICK
    kick_window_s: 0.5                          # TIME TO LOOK FOR THE KICK

output:
  validate: true                                # RUN THE OFFICIAL VALIDATOR
  verbose: false                                # PRINT WHAT THE LABELLER DOES
