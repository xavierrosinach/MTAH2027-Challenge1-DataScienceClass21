# As validation/bench_all20.yaml with the SkillCorner ground truth from its player_possession events.
# Validation bench / training set with 20 approved games: the 3 Metrica sample games
# (validation/bench.yaml), the 7 IDSSE games (validation/bench_dfl.yaml) and 10 SkillCorner games
# (validation/bench_skc.yaml: the 2025-10 release). Other matches only.
#   python validation/train_control.py --config <variant> --bench validation/bench_all20.yaml
#   python validation/bench.py --suite --bench validation/bench_all20.yaml ...
# Degradation, tags and suite as validation/bench_all.yaml (the ball is NOT hidden in dead time; see
# validation/bench_skc.yaml for the SkillCorner-only bench that hides it). SkillCorner ground truth:
# skillcorner_gt (group = possession group of the tracking, events = player_possession events).

metrica_dir: ../external/metrica-sample-data
idsse_dir: ../external/idsse
skillcorner_dir: ../external/skillcorner
skillcorner_gt: events             # #15: the player_possession events (coherent: 92 % nearest-player agreement, as IDSSE)
games: [Sample_Game_1, Sample_Game_2, Sample_Game_3,
        IDSSE_J03WMX, IDSSE_J03WN1, IDSSE_J03WOH, IDSSE_J03WOY, IDSSE_J03WPY, IDSSE_J03WQQ, IDSSE_J03WR9,
        SKC_1886347, SKC_1899585, SKC_1925299, SKC_1953632, SKC_1996435, SKC_2006229, SKC_2011166,
        SKC_2013725, SKC_2015213, SKC_2017461]

tags: none
synthetic_tags:
  lead_s: 4
  recall: 0.8

degrade:                    # as validation/bench.yaml
  enabled: true
  seeds: [0, 1, 2, 3]
  noise_m: 0.0
  players:
    enabled: true
    fragment_median_s: 35
    gap_median_s: 1.0
  ball_noise:
    sigma_m: 1.2
    corr_s: 1.0
  ball_lost_early_s: 0.6
  ball_live_gaps:
    per_min: 0.5
    median_s: 8.0

gt:
  min_spell_s: 0.0

suite:
  light: {tags: none, degrade: {ball_noise: {sigma_m: 0.6}, ball_lost_early_s: 0.0,
                                ball_live_gaps: {per_min: 0.0}}}
  degraded: {tags: none}
  degraded+tags: {tags: events}
  degraded+coarseGT: {tags: none, gt: {min_spell_s: 2.0}}
